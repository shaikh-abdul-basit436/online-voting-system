{% extends "base.html" %}
{% block title %}Administrator Login{% endblock %}
{% block content %}
<section class="form-page"><div class="form-shell admin-form">
  <div class="form-heading"><p class="eyebrow">Administration</p><h1>Admin sign in</h1><p>Restricted access for election management.</p></div>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button button-dark button-full" type="submit">Admin Login</button>
  </form>
</div></section>
{% endblock %}
